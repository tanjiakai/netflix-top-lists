name: Update catalog and deploy

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      # Exits non-zero without touching catalog.json if either chart comes back
      # empty, so a bad upstream day fails the run instead of blanking the add-on.
      - name: Scrape Netflix Top 10
        run: python -m scraper.scraper
        env:
          # Optional: poster lookup of last resort. Absent, those titles fall
          # back to a generated tile rather than failing the build.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}

      - name: Build static add-on
        run: python build_site.py
        env:
          ADDON_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Commit refreshed catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json
          git diff --staged --quiet || git commit -m "Update catalog [skip ci]"
          git push
        if: github.event_name != 'push'

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
